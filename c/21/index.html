<h2>당뇨가 걱정돼 먹은 약이 당뇨를 키웠다</h2>
<p>당뇨 전단계인 사람이 항정신병약을 먹기 시작했대요.</p>
<p>2년 안에 19%가 당뇨로 진행됐어요. 혈당이 정상이었던 사람은 3%였고요.</p>
<p>혈당·체중 변화는 약 시작한 첫 90일에 가장 빨랐대요. (영국 9만 7천 명 분석)</p>
<p class="why"><b>왜 중요한가:</b> 걱정해서 먹는 약이, 걱정하던 병을 키울 수 있다.</p>
