<h2>두려움은 고장이 아니라 과속이다</h2>
<p>불안·PTSD 환자의 뇌를 보니 해마가 &#x27;위험 기억&#x27;과 &#x27;안전 기억&#x27;을 겹쳐 저장하고 있었어요.</p>
<p>연구진은 이걸 고장이 아니라 &#x27;일단 피하고 보자&#x27;는 생존 시스템의 과잉 작동으로 봐요.</p>
<p>과잉 작동으로 보면 치료도 달라져요. 고치는 게 아니라 &#x27;진정시키는&#x27; 쪽으로.</p>
<p class="why"><b>왜 중요한가:</b> &quot;내가 이상한 게 아니라, 내 경보기가 열일하는 거다.&quot;</p>
