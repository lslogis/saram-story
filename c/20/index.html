<h2>병원에서는 정상, 집에서는 고혈압</h2>
<p>78살 이상 노인 100명 중 15명은 병원에선 혈압이 정상인데 집에선 높았대요.</p>
<p>이렇게 숨어있는 고혈압 노인은 1년 안에 넘어질 확률이 70% 높았어요.</p>
<p>반대로 병원에서만 높았던 사람은 오히려 39% 덜 넘어졌대요.</p>
<p class="why"><b>왜 중요한가:</b> 병원에 가면 우리는 환자가 된다. 누군가 보고 있다는 안도감에 몸이 놓인다. 집에 돌아오면 다시 자기 몸의 경비원이다.</p>
